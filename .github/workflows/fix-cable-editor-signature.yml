name: Fix Cable Editor Signature
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/plan/cable-editor-v1-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/cable-editor-v1-20260909
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: python3 -c "from pathlib import Path; p=Path('Source/UI/SignalLabPage.h'); s=p.read_text(); old='    void drawEdgeLabel\\n    {'; new='    void drawEdgeLabel (juce::Graphics& g, const GraphEdge& edge, juce::Colour colour)\\n    {'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
      - name: Validate and clean
        shell: bash
        run: |
          rm .github/workflows/fix-cable-editor-signature.yml
          python3 scripts/static-check.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Cable Editor draw label compile error"
          git push origin HEAD:plan/cable-editor-v1-20260909
