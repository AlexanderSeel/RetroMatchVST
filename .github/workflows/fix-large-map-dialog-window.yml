name: Fix large map dialog window

on:
  push:
    branches:
      - plan/big-signal-view-20260909
    paths:
      - scripts/fix-large-map-dialog-window.py
      - .github/workflows/fix-large-map-dialog-window.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/big-signal-view-20260909
          fetch-depth: 0
      - name: Apply dialog fix
        run: python scripts/fix-large-map-dialog-window.py
      - name: Static integrity
        run: python scripts/static-check.py
      - name: Commit source and remove scaffolding
        shell: bash
        run: |
          rm -f scripts/fix-large-map-dialog-window.py .github/workflows/fix-large-map-dialog-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix large Patch Map dialog lifecycle"
          git push origin HEAD:plan/big-signal-view-20260909
