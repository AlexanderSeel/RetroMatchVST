name: Apply lifecycle const-layer build fix

on:
  push:
    branches:
      - main
    paths:
      - scripts/fix-reference-lifecycle-layer-constness.py
      - .github/workflows/fix-reference-lifecycle-layer-constness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source fix
        run: python scripts/fix-reference-lifecycle-layer-constness.py
      - name: Static integrity
        run: python scripts/static-check.py
      - name: Commit source fix and remove scaffolding
        shell: bash
        run: |
          rm -f scripts/fix-reference-lifecycle-layer-constness.py .github/workflows/fix-reference-lifecycle-layer-constness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix const rack-layer lifecycle normalization"
          git push origin HEAD:main
