name: Polish Gold rack validation

on:
  push:
    branches:
      - validation/gold-rack-evolution-20260908

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation/gold-rack-evolution-20260908
          fetch-depth: 0
      - name: Apply finished-rack polish
        run: python3 scripts/polish-gold-rack-validation.py
      - name: Static source integrity
        run: python3 scripts/static-check.py
      - name: Remove temporary polish scaffolding
        shell: bash
        run: |
          rm scripts/polish-gold-rack-validation.py
          rm .github/workflows/polish-gold-rack-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Polish Gold finished-rack evolution"
          git push origin HEAD:validation/gold-rack-evolution-20260908
