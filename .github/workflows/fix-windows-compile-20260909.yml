name: Apply Windows compile fixes

on:
  push:
    branches: [ main ]
    paths:
      - scripts/fix-windows-compile-20260909.py
      - .github/workflows/fix-windows-compile-20260909.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch compile errors and warnings
        run: python scripts/fix-windows-compile-20260909.py
      - name: Static source contracts
        run: python scripts/static-check.py
      - name: Commit fixes and remove temporary patch machinery
        run: |
          git config user.name "RetroMatch Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/fix-windows-compile-20260909.py .github/workflows/fix-windows-compile-20260909.yml
          git add Source/UI/MatchCompareDialog.h Source/Engine/SynthEngine.cpp Source/UI/SignalLabPage.h Source/UI/MelodyPage.h Source/UI/RetroMatchEditorV3.cpp
          git commit -m "Fix Windows compile after Compare and routing updates"
          git push origin HEAD:main
