name: Apply FX guitar resynthesis advisor

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-fx-guitar-advisor-20260908.py'

permissions:
  contents: write

jobs:
  migrate-build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply FX guitar strategy and advisor migration
        shell: pwsh
        run: python scripts/apply-fx-guitar-advisor-20260908.py
      - name: Static source integrity
        shell: pwsh
        run: python scripts/static-check.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-fx-advisor -A x64 -DRETROMATCH_COPY_PLUGIN=OFF -DRETROMATCH_BUILD_TESTS=ON
      - name: Build VST3 and Standalone
        shell: pwsh
        run: cmake --build build-fx-advisor --config Release --target RetroMatchSynth_VST3 RetroMatchSynth_Standalone --parallel
      - name: Build and run DSP smoke tests
        shell: pwsh
        run: |
          cmake --build build-fx-advisor --config Release --target RetroMatchTests --parallel
          ctest --test-dir build-fx-advisor -C Release --output-on-failure
      - name: Commit validated source upgrade
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/apply-fx-guitar-advisor-20260908.yml'
          Remove-Item 'scripts/apply-fx-guitar-advisor-20260908.py'
          if (Test-Path 'build-fx-advisor') { Remove-Item 'build-fx-advisor' -Recurse -Force }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source Tests
          git add -u .github/workflows scripts
          git diff --cached --check
          git commit -m 'Add FX guitar resynthesis advisor and probe scoring'
          git push origin HEAD:main
