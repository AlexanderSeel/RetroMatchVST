name: Fix MSEG tempo layout

on:
  push:
    branches:
      - plan/cable-editor-v1-20260909
    paths:
      - scripts/fix-mseg-tempo-layout.py
      - .github/workflows/fix-mseg-tempo-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/cable-editor-v1-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-mseg-tempo-layout.py
      - run: python scripts/static-check.py
      - name: Commit and remove temporary migration
        shell: bash
        run: |
          rm -f scripts/fix-mseg-tempo-layout.py .github/workflows/fix-mseg-tempo-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep MSEG tempo controls readable at narrow widths"
          git push origin HEAD:plan/cable-editor-v1-20260909
