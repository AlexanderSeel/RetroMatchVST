name: Merge main into PatchGraph

on:
  push:
    branches:
      - plan/typed-patch-graph-20260909

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/typed-patch-graph-20260909
          fetch-depth: 0
      - name: Merge current main and resolve known additive overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-commit --no-ff || true
          python - <<'PY'
          from pathlib import Path
          import subprocess

          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()
          allowed = {'Tests/SmokeTests.cpp', 'scripts/static-check.py', 'plan.md'}
          unknown = [p for p in conflicts if p not in allowed]
          assert not unknown, f'Unexpected merge conflicts: {unknown}'

          def checkout_ours(path):
              subprocess.check_call(['git','checkout','--ours','--',path])

          if 'Tests/SmokeTests.cpp' in conflicts:
              checkout_ours('Tests/SmokeTests.cpp')
              p = Path('Tests/SmokeTests.cpp')
              ours = p.read_text(encoding='utf-8')
              main = subprocess.check_output(['git','show','origin/main:Tests/SmokeTests.cpp'], text=True)
              if 'VoiceParameters fullRack;' not in ours:
                  start_marker = '    {\n        VoiceParameters fullRack;\n'
                  next_marker = '    {\n        SoundFeatures guitar;\n'
                  start = main.find(start_marker)
                  end = main.find(next_marker, start)
                  assert start >= 0 and end > start, 'Gold smoke block not found in main'
                  block = main[start:end]
                  anchor = '    if (! runMelodyTests()) return 1;\n'
                  assert anchor in ours, 'Smoke insertion anchor missing'
                  ours = ours.replace(anchor, anchor + block, 1)
                  p.write_text(ours, encoding='utf-8')

          if 'scripts/static-check.py' in conflicts:
              checkout_ours('scripts/static-check.py')
              p = Path('scripts/static-check.py')
              text = p.read_text(encoding='utf-8')
              token_line = "    'gold rack evolution': ['evolveGoldRack', 'mutateGoldRack', 'globalFxModules', 'wholeInstrumentRack', 'seedGoldWholeInstrumentRack'],\n"
              if token_line not in text:
                  anchor = "    'gold full rack search': ['buildGoldCandidateBank', 'makeEmbeddedResynthRack', 'fullRackScore', 'GOLD / FULL RACK'],\n"
                  assert anchor in text, 'Gold token anchor missing'
                  text = text.replace(anchor, anchor + token_line, 1)
              text_line = "    'gold rack evolution': processor + processor_h + engine_h + engine_cpp,\n"
              if text_line not in text:
                  anchor = "    'gold full rack search': processor + processor_h + editor_all,\n"
                  assert anchor in text, 'Gold text-map anchor missing'
                  text = text.replace(anchor, anchor + text_line, 1)
              p.write_text(text, encoding='utf-8')

          if 'plan.md' in conflicts:
              checkout_ours('plan.md')
              p = Path('plan.md')
              text = p.read_text(encoding='utf-8')
              if '### Rack-level evolution' not in text:
                  text = text.rstrip() + '''\n\n\n### Rack-level evolution\n\n- Gold does not stop after choosing a synthesis method and layer count.\n- Evolve the completed rack with bounded full renders: main/layer gain, pan, tune, role timbre and MSEG movement.\n- Include a whole-instrument post-sum filter/FX rack in the offline Gold model and mirror the winning rack into the live global FX controls.\n- Use white-noise transfer analysis at higher spectral resolution plus a multi-tone nonlinear probe for guitar/pedal/amp-chain matching.\n- Keep excitation probes diagnostic/secondary; the musical full-rack similarity remains the displayed truth.\n'''
                  p.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/merge-main-into-patchgraph.yml')
          if workflow.exists(): workflow.unlink()
          PY
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "Integrate Gold and persistent PatchGraph work"
          git push origin HEAD:plan/typed-patch-graph-20260909
