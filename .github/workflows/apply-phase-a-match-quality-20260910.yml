name: Apply Phase A match quality recovery

on:
  push:
    paths:
      - '.github/workflows/apply-phase-a-match-quality-20260910.yml'

permissions:
  contents: write

jobs:
  recover-match-quality:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate patch scripts
        shell: pwsh
        run: |
          python -m py_compile scripts/apply-phase-a-match-quality-20260910.py
          python -m py_compile scripts/apply-phase-a-match-quality-v2-20260910.py
      - name: Apply previously validated DSP recovery patch
        shell: pwsh
        run: python scripts/apply-phase-a-match-quality-v2-20260910.py
      - name: Static source integrity
        shell: pwsh
        run: python scripts/static-check.py
      - name: Commit validated recovery and remove staging files
        shell: bash
        run: |
          git config user.name "Alexander Seel"
          git config user.email "mr.alexander.seel@gmail.com"
          git rm .github/workflows/apply-phase-a-match-quality-20260910.yml scripts/apply-phase-a-match-quality-20260910.py scripts/apply-phase-a-match-quality-v2-20260910.py
          git add -A
          git diff --cached --check
          git commit -m "Recover clean match and Compare semantics"
          git push origin HEAD:main

# Exact source transforms were already validated by run 34459281286:
# Windows VST3 + Standalone built and Smoke/FineTune/OneShot all passed.
