name: Apply resynthesis method UI

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/apply-resynth-method-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UI patch
        run: python scripts/apply-resynth-method-ui.py

      - name: Static integrity checks
        run: python scripts/static-check.py

      - name: Commit source changes
        run: |
          git config user.name "RetroMatch UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Source/UI/RetroMatchEditorV3.h Source/UI/RetroMatchEditorV3.cpp Source/UI/MatchCompareDialog.h Source/UI/ReferenceEditorDialog.h
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Expose resynthesis methods in reference workflow"
          git push origin HEAD:main
