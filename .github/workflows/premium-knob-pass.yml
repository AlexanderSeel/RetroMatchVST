name: Premium knob control pass

on:
  push:
    paths:
      - 'scripts/apply-premium-knob-pass.py'
      - '.github/workflows/premium-knob-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply premium rotary control pass
        run: python3 scripts/apply-premium-knob-pass.py
      - name: Run source integrity checks
        run: python3 scripts/static-check.py
      - name: Commit directly to main and remove staging helpers
        shell: bash
        run: |
          rm scripts/apply-premium-knob-pass.py .github/workflows/premium-knob-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use premium rotary controls for FX and modulation"
          git push origin HEAD:main
