name: Build plug-ins

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Static source integrity
        run: |
          python3 scripts/static-check.py
          python3 scripts/check-windows-container-tests.py

  windows:
    needs: source-check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Validate Windows PowerShell build helpers
        shell: pwsh
        run: |
          $paths = @(
            'scripts/build-docker.ps1',
            'scripts/repair-windows-docker-layer.ps1',
            'scripts/build-windows-direct-container.ps1',
            'scripts/provision-container-windows.ps1'
          )
          $allErrors = @()
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $path" -ForegroundColor Red
              $parseErrors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
              $allErrors += $parseErrors
            }
          }
          if ($allErrors.Count -gt 0) { exit 1 }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DRETROMATCH_COPY_PLUGIN=OFF -DRETROMATCH_BUILD_TESTS=ON
      - name: Build VST3 and Standalone
        shell: pwsh
        run: cmake --build build --config Release --target RetroMatchSynth_VST3 RetroMatchSynth_Standalone --parallel
      - name: Build and run DSP tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target RetroMatchTests RetroMatchFineTuneTests RetroMatchOneShotTests RetroMatchTelemetryTests RetroMatchPhaseATests RetroMatchSequencerTests --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: RetroMatchSynth-Windows-x64
          if-no-files-found: error
          path: |
            build/RetroMatchSynth_artefacts/Release/VST3/RetroMatch Synth.vst3/**
            build/RetroMatchSynth_artefacts/Release/Standalone/RetroMatch Synth.exe

  macos:
    needs: source-check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Configure universal build
        run: >-
          cmake -S . -B build -G Xcode
          -DRETROMATCH_COPY_PLUGIN=OFF
          -DRETROMATCH_BUILD_TESTS=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build AU, VST3 and Standalone
        # CI artifacts are intentionally unsigned. JUCE retains its own VST3 ad-hoc
        # verification/signing helper where required for manifest generation; disabling
        # Xcode-managed signing avoids looking for a non-existent keychain identity.
        run: cmake --build build --config Release --target RetroMatchSynth_AU RetroMatchSynth_VST3 RetroMatchSynth_Standalone --parallel -- CODE_SIGNING_ALLOWED=NO
      - name: Build and run DSP tests
        run: |
          cmake --build build --config Release --target RetroMatchTests RetroMatchFineTuneTests RetroMatchOneShotTests RetroMatchTelemetryTests RetroMatchPhaseATests RetroMatchSequencerTests --parallel -- CODE_SIGNING_ALLOWED=NO
          ctest --test-dir build -C Release --output-on-failure
      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: RetroMatchSynth-macOS-Universal
          if-no-files-found: error
          path: |
            build/RetroMatchSynth_artefacts/Release/AU/RetroMatch Synth.component/**
            build/RetroMatchSynth_artefacts/Release/VST3/RetroMatch Synth.vst3/**
            build/RetroMatchSynth_artefacts/Release/Standalone/RetroMatch Synth.app/**
