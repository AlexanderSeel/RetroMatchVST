name: Premium UI layout pass

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/premium-ui-layout-pass.py'
      - '.github/workflows/premium-ui-layout-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI layout corrections
        run: python3 scripts/premium-ui-layout-pass.py
      - name: Run source integrity checks
        run: python3 scripts/static-check.py
      - name: Commit directly to main and remove staging helpers
        shell: bash
        run: |
          rm -f scripts/premium-ui-layout-pass.py .github/workflows/premium-ui-layout-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine premium synth UI spacing and large views"
          git push origin HEAD:main
