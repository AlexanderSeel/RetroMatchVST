name: Apply Phase A truth-matching constraints

on:
  push:
    paths:
      - '.github/workflows/apply-phase-a-truth-constraints-20260910.yml'

permissions:
  contents: write

jobs:
  validate-truth-matching:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate patch script
        shell: pwsh
        run: python -m py_compile scripts/apply-phase-a-truth-constraints-20260910.py
      - name: Apply truth-matching constraints
        shell: pwsh
        run: python scripts/apply-phase-a-truth-constraints-20260910.py
      - name: Static source integrity
        shell: pwsh
        run: python scripts/static-check.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-phase-a2 -A x64 -DRETROMATCH_COPY_PLUGIN=OFF -DRETROMATCH_BUILD_TESTS=ON
      - name: Build VST3
        shell: pwsh
        run: cmake --build build-phase-a2 --config Release --target RetroMatchSynth_VST3 --parallel
      - name: Build DSP tests
        shell: pwsh
        run: cmake --build build-phase-a2 --config Release --target RetroMatchTests RetroMatchFineTuneTests RetroMatchOneShotTests --parallel
      - name: Run DSP tests
        shell: pwsh
        run: ctest --test-dir build-phase-a2 -C Release --output-on-failure
      - name: Commit validated truth-matching constraints
        shell: bash
        run: |
          git config user.name "Alexander Seel"
          git config user.email "mr.alexander.seel@gmail.com"
          rm -rf build-phase-a2
          git rm .github/workflows/apply-phase-a-truth-constraints-20260910.yml scripts/apply-phase-a-truth-constraints-20260910.py
          git add -A
          git diff --cached --check
          git commit -m "Constrain nonlinear matching to reference evidence"
          git push origin HEAD:main
