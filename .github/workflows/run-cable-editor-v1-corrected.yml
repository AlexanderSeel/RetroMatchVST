name: Run corrected Cable Editor v1

on:
  push:
    branches:
      - plan/cable-editor-v1-20260909
    paths:
      - .github/workflows/run-cable-editor-v1-corrected.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/cable-editor-v1-20260909
          fetch-depth: 0
      - name: Apply corrected migration
        run: python3 scripts/apply-cable-editor-v1-20260909.py
      - name: Remove temporary migration scaffolding
        run: |
          rm -f scripts/apply-cable-editor-v1-20260909.py
          rm -f .github/workflows/apply-cable-editor-v1.yml
          rm -f .github/workflows/run-cable-editor-v1-corrected.yml
      - name: Static source integrity
        run: python3 scripts/static-check.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Cable Editor v1"
          git push origin HEAD:plan/cable-editor-v1-20260909
