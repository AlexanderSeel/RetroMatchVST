name: Apply large Patch Map window lifecycle

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-large-map-window-lifecycle.py
      - .github/workflows/apply-large-map-window-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply dialog lifecycle patch
        run: python scripts/apply-large-map-window-lifecycle.py
      - name: Static integrity
        run: python scripts/static-check.py
      - name: Commit implementation and remove scaffolding
        shell: bash
        run: |
          rm -f scripts/apply-large-map-window-lifecycle.py .github/workflows/apply-large-map-window-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix large Patch Map dialog lifecycle"
          git push origin HEAD:main
