name: Apply MSEG global bus and patch map upgrade

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-mseg-globalbus-patchmap-20260908.py'
      - '.github/workflows/apply-mseg-globalbus-patchmap-20260908.yml'

permissions:
  contents: write

jobs:
  migrate-build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply MSEG, global bus and patch-map migration
        shell: pwsh
        run: python scripts/apply-mseg-globalbus-patchmap-20260908.py
      - name: Static source integrity
        shell: pwsh
        run: python scripts/static-check.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DRETROMATCH_COPY_PLUGIN=OFF -DRETROMATCH_BUILD_TESTS=ON
      - name: Build VST3 and Standalone
        shell: pwsh
        run: cmake --build build --config Release --target RetroMatchSynth_VST3 RetroMatchSynth_Standalone --parallel
      - name: Build and run DSP smoke tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target RetroMatchTests --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Commit validated source upgrade
        shell: pwsh
        run: |
          Remove-Item 'build' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/apply-mseg-globalbus-patchmap-20260908.yml'
          Remove-Item 'scripts/apply-mseg-globalbus-patchmap-20260908.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Expand MSEG, global effects bus and patch map editing'
          git push origin HEAD:main
