name: Apply Compare fine-tune UI

on:
  push:
    branches:
      - plan/compare-finetune-20260909
    paths:
      - '.github/workflows/apply-compare-finetune-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: plan/compare-finetune-20260909
          fetch-depth: 0
      - name: Apply focused source patch
        run: python3 scripts/apply-compare-finetune-ui.py
      - name: Remove one-shot patch scaffolding
        run: |
          rm scripts/apply-compare-finetune-ui.py
          rm .github/workflows/apply-compare-finetune-ui.yml
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/PluginProcessor.h Source/PluginProcessor.cpp Source/UI/MatchCompareDialog.h scripts/apply-compare-finetune-ui.py .github/workflows/apply-compare-finetune-ui.yml
          git commit -m "Add live Compare fine-tune controls"
          git push origin HEAD:plan/compare-finetune-20260909
