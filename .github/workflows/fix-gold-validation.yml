name: Fix Gold validation source

on:
  push:
    branches:
      - validation/gold-rack-evolution-20260908

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation/gold-rack-evolution-20260908
          fetch-depth: 0
      - name: Add Gold rack helper declaration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Source/PluginProcessor.cpp')
          text = path.read_text(encoding='utf-8')
          marker = 'VoiceParameters makeEmbeddedResynthRack (const MatchResult& mainResult, const SoundFeatures& reference,\n'
          declaration = 'void seedGoldWholeInstrumentRack (VoiceParameters& rack, const SoundFeatures& reference, int strategy);\n\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one embedded rack definition, got {text.count(marker)}')
          if declaration not in text:
              text = text.replace(marker, declaration + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Static source integrity
        run: python3 scripts/static-check.py
      - name: Remove workflow and commit source fix
        shell: bash
        run: |
          rm .github/workflows/fix-gold-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Fix Gold rack helper declaration order"
          git push origin HEAD:validation/gold-rack-evolution-20260908
