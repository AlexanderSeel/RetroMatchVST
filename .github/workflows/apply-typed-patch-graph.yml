name: Apply typed patch graph

on:
  push:
    branches:
      - plan/typed-patch-graph-20260909

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/typed-patch-graph-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply integration
        run: python scripts/apply-typed-patch-graph.py
      - name: Static integrity
        run: python scripts/static-check.py
      - name: Commit generated source and remove scaffolding
        shell: bash
        run: |
          rm scripts/apply-typed-patch-graph.py
          rm .github/workflows/apply-typed-patch-graph.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add persistent typed patch graph"
          git push
