name: Apply FX probe dynamics correction

on:
  push:
    paths:
      - '.github/workflows/apply-effect-probe-dynamics-20260910.yml'

permissions:
  contents: write

jobs:
  validate-effect-probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate patch script
        shell: pwsh
        run: python -m py_compile scripts/apply-effect-probe-dynamics-20260910.py
      - name: Apply crest-domain correction
        shell: pwsh
        run: python scripts/apply-effect-probe-dynamics-20260910.py
      - name: Static source integrity
        shell: pwsh
        run: python scripts/static-check.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-effect-probe -A x64 -DRETROMATCH_COPY_PLUGIN=OFF -DRETROMATCH_BUILD_TESTS=ON
      - name: Build matching smoke tests
        shell: pwsh
        run: cmake --build build-effect-probe --config Release --target RetroMatchTests --parallel
      - name: Run matching smoke tests
        shell: pwsh
        run: ctest --test-dir build-effect-probe -C Release -R RetroMatchSmoke --output-on-failure
      - name: Commit validated scoring correction
        shell: bash
        run: |
          git config user.name "Alexander Seel"
          git config user.email "mr.alexander.seel@gmail.com"
          rm -rf build-effect-probe
          git rm .github/workflows/apply-effect-probe-dynamics-20260910.yml scripts/apply-effect-probe-dynamics-20260910.py
          git add -A
          git diff --cached --check
          git commit -m "Align FX probe dynamics with reference crest factor"
          git push origin HEAD:main
