name: Fix typed patch graph review

on:
  push:
    branches:
      - plan/typed-patch-graph-20260909

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/typed-patch-graph-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply review fixes
        run: python scripts/fix-typed-patch-graph-review.py
      - name: Static integrity
        run: python scripts/static-check.py
      - name: Commit fixes and remove scaffolding
        shell: bash
        run: |
          rm scripts/fix-typed-patch-graph-review.py
          rm .github/workflows/fix-typed-patch-graph-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix typed graph port ownership"
          git push
