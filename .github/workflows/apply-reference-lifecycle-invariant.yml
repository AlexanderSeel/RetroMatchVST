name: Apply reference lifecycle invariant

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-reference-lifecycle-invariant.py
      - .github/workflows/apply-reference-lifecycle-invariant.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply lifecycle patch
        run: python scripts/apply-reference-lifecycle-invariant.py
      - name: Static integrity
        run: python scripts/static-check.py
      - name: Commit implementation and remove scaffolding
        shell: bash
        run: |
          rm -f scripts/apply-reference-lifecycle-invariant.py .github/workflows/apply-reference-lifecycle-invariant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce one-shot lifecycle across generated racks"
          git push origin HEAD:main
