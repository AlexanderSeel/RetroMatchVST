name: Apply reference editor and sound designer upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-reference-editor-20260907.yml'

permissions:
  contents: write

jobs:
  migrate-and-diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply migrations
        shell: pwsh
        run: |
          python -m py_compile scripts/apply-reference-editor-20260907.py
          python -m py_compile scripts/apply-sound-designer-20260907.py
          python scripts/apply-reference-editor-20260907.py
          $path = 'Source/UI/ReferenceRegion.h'
          $text = Get-Content $path -Raw
          $old = 'return juce::jlimit (0.0, 1.0, (x - r.getX()) / juce::jmax (1.0f, r.getWidth())) * thumbnail.getTotalLength();'
          $new = 'return juce::jlimit (0.0, 1.0, (double) (x - r.getX()) / (double) juce::jmax (1.0f, r.getWidth())) * thumbnail.getTotalLength();'
          if (-not $text.Contains($old)) { throw 'ReferenceRegion coordinate marker not found.' }
          Set-Content -Path $path -Value ($text.Replace($old, $new)) -NoNewline
          python scripts/apply-sound-designer-20260907.py
          $path = 'scripts/static-check.py'
          $text = Get-Content $path -Raw
          $old = "'reference pitch correction': ['expectedFundamentalHz', 'estimateConfidenceAtFundamental', 'analyzeFile (loadedReferenceFile, expectedHz)'],"
          $new = "'reference pitch correction': ['expectedFundamentalHz', 'estimateConfidenceAtFundamental', 'analyzeFile (loadedReferenceFile, expectedHz, start, end)'],"
          if (-not $text.Contains($old)) { throw 'Reference pitch static contract marker not found.' }
          Set-Content -Path $path -Value ($text.Replace($old, $new)) -NoNewline
          python scripts/static-check.py

      - name: Configure ASan DSP tests
        shell: pwsh
        run: |
          cmake -S . -B build-asan -A x64 -DRETROMATCH_COPY_PLUGIN=OFF -DRETROMATCH_BUILD_TESTS=ON '-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi' '-DCMAKE_EXE_LINKER_FLAGS=/INCREMENTAL:NO'

      - name: Build ASan DSP tests
        shell: pwsh
        run: cmake --build build-asan --config RelWithDebInfo --target RetroMatchTests --parallel

      - name: Run ASan DSP tests directly
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = 'symbolize=1:abort_on_error=1:windows_hook_rtl_allocators=true'
          $exe = Resolve-Path 'build-asan/RetroMatchTests_artefacts/RelWithDebInfo/RetroMatchTests.exe'
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
