name: Apply Gold full-rack resynthesis

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-gold-match-20260908.py'
      - '.github/workflows/apply-gold-match-20260908.yml'

permissions:
  contents: write

jobs:
  migrate-build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply Gold Match migration
        shell: pwsh
        run: python scripts/apply-gold-match-20260908.py
      - name: Static source integrity
        shell: pwsh
        run: python scripts/static-check.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-gold -A x64 -DRETROMATCH_COPY_PLUGIN=OFF -DRETROMATCH_BUILD_TESTS=ON
      - name: Build VST3 and Standalone
        shell: pwsh
        run: cmake --build build-gold --config Release --target RetroMatchSynth_VST3 RetroMatchSynth_Standalone --parallel
      - name: Build and run DSP smoke tests
        shell: pwsh
        run: |
          cmake --build build-gold --config Release --target RetroMatchTests --parallel
          ctest --test-dir build-gold -C Release --output-on-failure
      - name: Commit validated Gold Match source
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/apply-gold-match-20260908.yml'
          Remove-Item 'scripts/apply-gold-match-20260908.py'
          if (Test-Path 'build-gold') { Remove-Item 'build-gold' -Recurse -Force }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source scripts/static-check.py plan.md
          git add -u .github/workflows scripts
          git diff --cached --check
          git commit -m 'Add Gold full-rack resynthesis search'
          git push origin HEAD:main
